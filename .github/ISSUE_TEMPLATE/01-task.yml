name: "Задача"
description: "Реализация части функциональности по FS и HLD."
title: "[Task]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Карточка должна быть **обозримой** (ориентир — до 2–3 дней работы одного человека)
        и **проверяемой**: готовность определяется по требованиям FS.
        Плохо: «Сделать чат». Хорошо: «Отправка текстового сообщения согласно F_Msg_1–F_Msg_3 и разделу 5.4 HLD».
  - type: dropdown
    id: module
    attributes:
      label: Модуль
      options:
        - Веб-клиент (web)
        - Auth (аккаунты и сеансы)
        - Chat (диалоги, группы, сообщения)
        - Media (файлы)
        - Presence (присутствие)
        - Gateway (WebSocket)
        - Инфраструктура / CI / окружение
        - Документация
    validations:
      required: true
  - type: input
    id: fs
    attributes:
      label: Требования FS
      description: Идентификаторы через запятую. Для служебных задач (CI, каркас) укажите «—» и пояснение ниже.
      placeholder: "F_Msg_1, F_Msg_2, F_Msg_3, NF_Perf_1"
    validations:
      required: true
  - type: input
    id: hld
    attributes:
      label: Разделы HLD
      placeholder: "3.4 Сервис чатов; 5.4 Диалоги, сообщения и подтверждения"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что именно нужно сделать (а не как — «как» определено в HLD).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии готовности
      description: Проверяемые условия по каждому требованию FS из карточки.
      value: |
        - [ ] F_XXX_1: ...
        - [ ] F_XXX_2: ...
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Зависимости
      description: От каких карточек/PR зависит эта задача (#номер).
    validations:
      required: false
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      description: Карточка переводится в «Done» только при выполнении всех пунктов.
      options:
        - label: Код влит в `main` через pull request с одобрением другого участника
        - label: Реализованы все требования FS, указанные в карточке
        - label: Проект собирается, приложение запускается
        - label: Изменения не ломают ранее реализованную функциональность (CI зелёный)
