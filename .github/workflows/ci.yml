name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.11.1"
  BUF_VERSION: "v1.75.0"
  GOBCO_VERSION: "v1.3.4"

jobs:
  go:
    name: Go / build, vet, unit, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Install gobco
        run: |
          go install github.com/rillig/gobco@${GOBCO_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Unit tests and coverage
        run: bash ../scripts/ci/go-coverage.sh
      - name: Publish Go coverage summary
        run: node ../scripts/ci/coverage-report.mjs --kind go
      - name: Upload Go coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: reports/
          if-no-files-found: error

  web:
    name: Web / lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests with branch coverage
        run: npm --workspace web run test:coverage
      - name: Build
        run: npm run build
      - name: Publish web coverage summary
        run: node scripts/ci/coverage-report.mjs --kind web
      - name: Upload web coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage/
          if-no-files-found: error

  api:
    name: API / buf, golden, compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@${BUF_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check and generate contracts
        working-directory: api
        run: |
          buf format --diff --exit-code
          buf lint
          buf build
          buf generate --template buf.gen.go.yaml
          buf generate --template buf.gen.ts.yaml --path proto/molotalk/v1
          buf generate --template buf.gen.openapi.public.yaml --path proto/molotalk/v1
          buf generate --template buf.gen.openapi.internal.yaml --path proto/molotalk/internal/v1
      - name: Check golden files
        run: |
          changed="$(git status --porcelain --untracked-files=all -- backend/gen api/gen api/src/gen)"
          if [ -n "${changed}" ]; then
            echo "::error::generated files differ from the committed golden files:"
            echo "${changed}"
            exit 1
          fi
      - name: Check compatibility against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && (github.event.before || 'HEAD^')) || '' }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/ci/buf-breaking.sh
      - name: API typecheck
        run: npm --workspace api run typecheck
      - name: API tests
        run: npm --workspace api run test

  containers:
    name: Containers / integration and routing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go integration tests
        run: go test -tags=integration -count=1 ./...
      - name: Caddy routing matrix
        env:
          ROUTING_PROJECT: molotalk-routing-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash ../deploy/tests/run-routing-checks.sh
