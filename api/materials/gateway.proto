syntax = "proto3";
package molotalk.v1;

// One binary protobuf envelope per WebSocket frame. The opcode defines payload encoding.
// IDENTIFY and READY use JSON. EVENT uses ServerEvent. sequence is always zero.
message GatewayEnvelope {
  GatewayOp op = 1;
  bytes payload = 2;
  int64 sequence = 3;
}
enum GatewayOp {
  GATEWAY_OP_UNSPECIFIED = 0;
  GATEWAY_OP_EVENT = 1;
  GATEWAY_OP_HEARTBEAT = 2;
  GATEWAY_OP_HEARTBEAT_ACK = 3;
  GATEWAY_OP_IDENTIFY = 4;
  reserved 5;
  GATEWAY_OP_READY = 6;
  reserved 7, 8;
}
// EVENT payload: protobuf ServerEvent. data_json contains the API DTO in UTF-8 JSON.
message ServerEvent {
  string event_id = 1;
  string type = 2;
  string occurred_at = 3;
  bytes data_json = 4;
}
