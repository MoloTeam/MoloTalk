syntax = "proto3";

package molotalk.internal.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "molotalk/v1/rules.proto";
import "molotalk/v1/types.proto";

option go_package = "github.com/MoloTeam/MoloTalk/backend/gen/molotalk/internal/v1;molotalkinternalv1";

// Внутренние RPC. Публичный пакет не импортирует этот.

service AuthInternalService {
  rpc IntrospectSession(IntrospectSessionRequest) returns (IntrospectSessionResponse);
}

service ChatInternalService {
  rpc CheckChatAccess(CheckChatAccessRequest) returns (CheckChatAccessResponse);
  rpc GetUserChatIds(GetUserChatIdsRequest) returns (GetUserChatIdsResponse);
}

service PresenceInternalService {
  rpc Heartbeat(HeartbeatRequest) returns (google.protobuf.Empty);
  rpc Disconnect(DisconnectRequest) returns (google.protobuf.Empty);
}

message IntrospectSessionRequest {
  string session_id = 1 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
  string user_id = 2 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
}

message IntrospectSessionResponse {
  bool active = 1;
}

message CheckChatAccessRequest {
  string user_id = 1 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
  string chat_id = 2 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
  optional string attachment_id = 3 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
}

message CheckChatAccessResponse {
  bool allowed = 1;
}

message GetUserChatIdsRequest {
  string user_id = 1 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
}

message GetUserChatIdsResponse {
  repeated string chat_ids = 1 [(buf.validate.field).repeated.items.string.(molotalk.v1.ulid) = true];
  repeated molotalk.v1.ReadState read_states = 2;
}

message HeartbeatRequest {
  string user_id = 1 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
  string session_id = 2 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
  string connection_id = 3 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
}

message DisconnectRequest {
  string user_id = 1 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
  string session_id = 2 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
  string connection_id = 3 [(buf.validate.field).string.(molotalk.v1.ulid) = true];
}
