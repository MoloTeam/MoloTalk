syntax = "proto3";

package molotalk.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "molotalk/v1/rules.proto";
import "molotalk/v1/types.proto";

option go_package = "github.com/MoloTeam/MoloTalk/backend/gen/molotalk/v1;molotalkv1";

service PresenceService {
  rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse);
}

message GetPresenceRequest {
  repeated string user_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
    items: {
      string: {[molotalk.v1.ulid]: true}
    }
  }];
}

message GetPresenceResponse {
  repeated Presence presences = 1 [(google.api.field_behavior) = REQUIRED];
}
