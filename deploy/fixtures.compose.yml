# Демонстрационная БД с миграциями и явной загрузкой fixture.
#
# Обычный deploy/docker-compose.yml службу fixtures не содержит.
#
#   docker compose -p molotalk-demo --env-file .env.example \
#     -f deploy/fixtures.compose.yml up -d --wait --wait-timeout 180
#   docker compose -p molotalk-demo --env-file .env.example \
#     -f deploy/fixtures.compose.yml run --rm fixtures

name: molotalk-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - fixtures-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MIGRATE_TIMEOUT: 60s
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  fixtures:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: fixtures
    command: ["-set", "basic"]
    profiles: ["fixtures"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  fixtures-data:
